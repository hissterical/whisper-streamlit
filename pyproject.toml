[project]
name = "echonote"
version = "0.1.0"
description = "A local voice journal built with FastAPI, Whisper, and SQLite"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "openai-whisper>=20250625",
    "langchain-ollama>=0.3.3",
    "python-multipart>=0.0.9",
    "psutil>=6.0.0",
    "uvicorn[standard]>=0.30.0",
]
